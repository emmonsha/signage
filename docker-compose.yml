name: signage

services:
  signage:
    build: .
    image: signage:latest
    container_name: signage
    restart: unless-stopped
    init: true                                   # корректные сигналы и зомби-процессы
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}   # рекомендуется (npm run hash-password); сервер сам сообщит, если пароль не задан
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}             # запасной вариант, открытый пароль
      AUTH_MODE: ${AUTH_MODE:-}                       # local | freeipa | both (пусто = freeipa при FREEIPA_ENABLED, иначе local)
      ADMIN_USER: ${ADMIN_USER:-admin}                # логин локального администратора (режимы local/both)
      FREEIPA_ENABLED: ${FREEIPA_ENABLED:-false}
      FREEIPA_URL: ${FREEIPA_URL:-}                   # ldaps://ipa.example.com:636 или ldap://ipa.example.com:389
      FREEIPA_BASE_DN: ${FREEIPA_BASE_DN:-}
      FREEIPA_USER_BASE_DN: ${FREEIPA_USER_BASE_DN:-}
      FREEIPA_BIND_DN: ${FREEIPA_BIND_DN:-}           # сервисная учётка для поиска пользователей
      FREEIPA_BIND_PASSWORD: ${FREEIPA_BIND_PASSWORD:-}
      FREEIPA_USER_FILTER: ${FREEIPA_USER_FILTER:-(uid={username})}
      FREEIPA_STARTTLS: ${FREEIPA_STARTTLS:-false}
      FREEIPA_TLS_CA_FILE: ${FREEIPA_TLS_CA_FILE:-}
      FREEIPA_TLS_REJECT_UNAUTHORIZED: ${FREEIPA_TLS_REJECT_UNAUTHORIZED:-true}
      FREEIPA_TIMEOUT_MS: ${FREEIPA_TIMEOUT_MS:-5000}
      FREEIPA_REQUIRE_GROUP: ${FREEIPA_REQUIRE_GROUP:-}
      ADMIN_ALLOWED_NETS: ${ADMIN_ALLOWED_NETS:-}     # например 192.168.0.0/16,10.0.0.0/8 — пусто = без ограничений
      SESSION_SECRET: ${SESSION_SECRET:-}            # необязательно, по умолчанию случайный при каждом старте
      SCREENS: ${SCREENS:-left,right,big_wall}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-50}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-2048}             # максимальный размер загружаемого видео
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-900}    # максимальная длина ролика
      VIDEO_MAX_FPS: ${VIDEO_MAX_FPS:-60}             # потолок частоты кадров (30 — для слабых плееров)
      VIDEO_THREADS: ${VIDEO_THREADS:-}               # потоков ffmpeg; пусто = авто
      VIDEO_PRESET: ${VIDEO_PRESET:-medium}           # скорость/качество x264: veryfast … slow
      TRUST_PROXY: ${TRUST_PROXY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PLAYER_DWS_USER: ${PLAYER_DWS_USER:-admin}     # логин Local DWS плеера
      PLAYER_DWS_PASSWORD: ${PLAYER_DWS_PASSWORD:-} # пароль Local DWS плеера
      PLAYER_DWS_SCHEME: ${PLAYER_DWS_SCHEME:-http}
      PLAYER_DWS_PORT: ${PLAYER_DWS_PORT:-80}
      SNAPSHOT_ORIGINAL: ${SNAPSHOT_ORIGINAL:-true}
      SNAPSHOT_KEEP: ${SNAPSHOT_KEEP:-20}
      SNAPSHOT_TIMEOUT_MS: ${SNAPSHOT_TIMEOUT_MS:-15000}
      DEPLOY_ENABLED: ${DEPLOY_ENABLED:-false}
      DEPLOY_AGENT_URL: ${DEPLOY_AGENT_URL:-http://127.0.0.1:9123}
      DEPLOY_AGENT_TOKEN: ${DEPLOY_AGENT_TOKEN:-}
      TZ: ${TZ:-UTC}
    volumes:
      - storage:/storage                          # плейлисты (data/) и картинки (uploads/)
    read_only: true                               # код в образе не изменяется
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g                                 # ffmpeg при конвертации 1080p берёт до ~1 ГБ
    pids_limit: 512                               # потоки ffmpeg считаются как процессы
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  storage:
