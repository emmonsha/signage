<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<style>
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #d9e1ec;
    --surface: #f7f9fc;
    --border: #aebccd;
    --border-strong: #8fa0b5;
    --text: #1f2d3d;
    --text-muted: #41505f;
    --accent: #0b5ed7;
    --accent-hover: #0a58ca;
    --danger: #c0392b;
    --focus-ring: 0 0 0 3px rgba(11, 94, 215, .28);
    --shadow-2: 0 4px 12px rgba(16, 24, 40, .12), 0 12px 32px rgba(16, 24, 40, .16);
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-ui);
    background: var(--bg);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; margin: 0; padding: 24px;
  }
  .box {
    background: var(--surface);
    padding: 32px 28px 24px;
    border-radius: 12px;
    box-shadow: var(--shadow-2);
    width: 340px; max-width: 100%;
  }
  .box h2 { margin: 0 0 20px; font-size: 20px; text-align: center; }
  input {
    width: 100%; padding: 10px 12px; margin: 0 0 12px;
    border: 1px solid var(--border-strong); border-radius: 8px;
    font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: var(--focus-ring); }
  /* Поле логина показываем всегда: в режиме freeipa/both его вводит пользователь,
     в local оно предзаполнено ADMIN_USER (учётка одна). Так форма одинакова и
     предсказуема, и не зависит от /api/auth и таймингов. */
  button {
    width: 100%; min-height: 44px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 8px;
    font: inherit; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  button:hover:enabled { background: var(--accent-hover); }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { color: var(--text-muted); font-size: 13px; margin: 16px 0 0; text-align: center; }
  .err {
    color: var(--danger); font-size: 13px;
    min-height: 16px; margin: 10px 0 0; text-align: center;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

</style>
</head>
<body data-auth-mode="__AUTH_MODE__">
<form class="box" onsubmit="login(event)">
  <h2>Управление экранами</h2>
  <input type="text" id="user" placeholder="Логин" autocomplete="username" value="__AUTH_USER__">
  <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password">
  <button type="submit" id="btn">Войти</button>
  <p class="err" id="err"></p>
  <p class="hint" id="hint">__AUTH_HINT__</p>
</form>
<script>
// Логин и подсказка отрисованы на сервере по AUTH_MODE (детерминированно),
// поэтому форма корректна даже без JS. Здесь — только удобство фокуса:
// если логин уже подставлен (local-режим) — курсор сразу в пароль, иначе — в логин.
(function () {
  const u = document.getElementById('user'), p = document.getElementById('pass');
  (u && u.value.trim() ? p : u).focus();
})();

async function login(e) {
  e.preventDefault();
  const err = document.getElementById('err'), btn = document.getElementById('btn');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Вхожу…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('user').value,
        password: document.getElementById('pass').value
      })
    });
    const data = await res.json();
    if (data.success) { location.reload(); return; }
    err.textContent = data.message || 'Не удалось войти';
  } catch {
    err.textContent = 'Сервер недоступен';
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
    document.getElementById('pass').value = '';
  }
}
</script>
</body>
</html>
