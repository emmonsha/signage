# Вариант с Docker secrets: хэш пароля берётся из файла, а не из .env
#   mkdir -p secrets && docker compose run --rm --no-deps signage node hash-password.js \
#     | sed 's/^ADMIN_PASSWORD_HASH=//' > secrets/admin_password_hash
#   chmod 400 secrets/admin_password_hash      # файл должен читаться uid 1000 (пользователь node в контейнере)
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
services:
  signage:
    environment:
      ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      # При включённом FreeIPA пароль сервисной учётки тоже можно держать в секрете.
      # Раскомментируйте обе строки ниже и создайте файл (иначе compose не найдёт его и упадёт):
      #   printf '%s' '<пароль>' > secrets/freeipa_bind_password && chmod 400 secrets/freeipa_bind_password
      # FREEIPA_BIND_PASSWORD_FILE: /run/secrets/freeipa_bind_password
    secrets:
      - admin_password_hash
      # - freeipa_bind_password

secrets:
  admin_password_hash:
    file: ./secrets/admin_password_hash
  # freeipa_bind_password:
  #   file: ./secrets/freeipa_bind_password
